name: cat launcher
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Arquitetura do APK"
        required: true
        default: "all"
        type: choice
        options: ["all", "arm64", "arm", "x86", "x86_64"]
      build_type:
        description: "Tipo de build"
        required: true
        default: "auto"
        type: choice
        options: ["auto", "debug", "release", "both"]
  push:
    branches: ["**"]
permissions:
  contents: read
env:
  REPORT_DIR: /tmp/zreport
  SRC_ROOT: /home/runner/zalith-src
  ARCH: ${{ github.event.inputs.arch || 'all' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'auto' }}
  UPSTREAM_REF: main
jobs:
  build:
    name: Verificar, corrigir e compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Liberar espaço em disco e preparar relatório
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          mkdir -p "$REPORT_DIR" "$SRC_ROOT"
          : > "$REPORT_DIR/problems.txt"
          : > "$REPORT_DIR/fixed.txt"
      - name: "Verificação 1/4 - ZIPs"
        run: |
          set -uo pipefail
          ZIPS=($(seq 1 29))
          expected=${#ZIPS[@]}; found=0; ok=0
          : > "$REPORT_DIR/zips.txt"
          # Se não há nenhum CatNN.zip mas o projeto já está no repositório, usa-o direto
          if ! find "$GITHUB_WORKSPACE" -type f -iregex '.*/cat[_ -]*[0-9]+\.zip' -not -path '*/.git/*' | grep -q . \
             && { [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ] || [ -f "$GITHUB_WORKSPACE/settings.gradle" ]; }; then
            echo "Nenhum CatNN.zip encontrado; usando o projeto que já está no repositório."
            tar --exclude=.git -C "$GITHUB_WORKSPACE" -cf - . | tar -C "$SRC_ROOT" -xf -
            exit 0
          fi
          find_one() {
            find "$GITHUB_WORKSPACE" -type f -iregex ".*/cat[_ -]*0*$1\.zip" -not -path '*/.git/*' 2>/dev/null \
              | awk '{ print length($0) "\t" $0 }' | sort -n | cut -f2-
          }
          for n in "${ZIPS[@]}"; do
            mapfile -t hits < <(find_one "$n")
            if [ "${#hits[@]}" -eq 0 ]; then
              echo "::error::ZIP número $n ausente no repositório (esperado Cat__$(printf %02d "$n").zip)"
              continue
            fi
            found=$((found+1))
            f="${hits[0]}"
            size=$(stat -c %s "$f")
            magic=$(head -c2 "$f" 2>/dev/null)
            if [ "$size" -lt 1024 ] || [ "$magic" != "PK" ]; then
              echo "::error::$f não é um ZIP válido (tamanho=$size)"
              continue
            fi
            if ! unzip -tqq "$f" >/dev/null 2>&1; then
              echo "::error::Falha no teste de integridade: $f"
              continue
            fi
            echo "$f" >> "$REPORT_DIR/zips.txt"
            ok=$((ok+1))
          done
          {
            echo "ZIPS_EXPECTED=$expected"
            echo "ZIPS_FOUND=$found"
            echo "ZIPS_OK=$ok"
          } >> "$GITHUB_ENV"
          [ "$ok" -eq "$expected" ] || { echo "::error::Nem todos os ZIPs passaram na verificação."; exit 1; }
      - name: "Verificação 2/4 - extrair"
        run: |
          set -uo pipefail
          while IFS= read -r z; do
            echo "Extraindo $z"
            unzip -oq "$z" -d "$SRC_ROOT" || echo "::error::Falha ao extrair $z"
          done < "$REPORT_DIR/zips.txt"
          # se tudo veio dentro de uma única pasta raiz, sobe um nível
          n=$(find "$SRC_ROOT" -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$n" -eq 1 ] && [ -d "$(find "$SRC_ROOT" -mindepth 1 -maxdepth 1)" ]; then
            d=$(find "$SRC_ROOT" -mindepth 1 -maxdepth 1)
            echo "Subindo conteúdo de $d"
            shopt -s dotglob; mv "$d"/* "$SRC_ROOT"/; rmdir "$d"
          fi
          echo "Conteúdo de $SRC_ROOT:"; ls -la "$SRC_ROOT" | head -60
      - name: "Completar arquivos faltantes"
        run: |
          set -eu
          [ -d /tmp/upstream ] || { git clone --depth 1 --branch "$UPSTREAM_REF" https://github.com/ZalithLauncher/ZalithLauncher2.git /tmp/upstream || git clone --depth 1 https://github.com/ZalithLauncher/ZalithLauncher2.git /tmp/upstream; }
          if [ ! -f "$SRC_ROOT/settings.gradle.kts" ] && [ ! -f "$SRC_ROOT/settings.gradle" ]; then
            for f in settings.gradle.kts build.gradle.kts gradle.properties gradlew gradlew.bat; do
              if [ -f "/tmp/upstream/$f" ] && [ ! -f "$SRC_ROOT/$f" ]; then
                cp "/tmp/upstream/$f" "$SRC_ROOT/$f"
              fi
            done
            if [ -d /tmp/upstream/gradle ] && [ ! -d "$SRC_ROOT/gradle" ]; then
              cp -r /tmp/upstream/gradle "$SRC_ROOT/gradle"
            fi
            if [ -f "$SRC_ROOT/gradlew" ]; then chmod +x "$SRC_ROOT/gradlew"; fi
          fi
          # Completa gradlew e gradle/wrapper se algum estiver ausente no projeto
          S=$(find "$SRC_ROOT" -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/build/*' 2>/dev/null | awk '{ print length($0) "\t" $0 }' | sort -n | cut -f2- | sed -n 1p || true)
          if [ -n "${S:-}" ]; then
            PD=$(dirname "$S")
            for f in gradlew gradlew.bat; do
              [ -f "$PD/$f" ] || { [ -f "/tmp/upstream/$f" ] && cp "/tmp/upstream/$f" "$PD/$f" && echo "Copiado $f do upstream"; } || true
            done
            mkdir -p "$PD/gradle/wrapper"
            for f in gradle-wrapper.jar gradle-wrapper.properties; do
              [ -f "$PD/gradle/wrapper/$f" ] || { [ -f "/tmp/upstream/gradle/wrapper/$f" ] && cp "/tmp/upstream/gradle/wrapper/$f" "$PD/gradle/wrapper/$f" && echo "Copiado wrapper/$f do upstream"; } || true
            done
            [ -f "$PD/gradlew" ] && chmod +x "$PD/gradlew"
          fi
          for m in ZalithLauncher Guide InputMap ColorPicker CardGrid LayerController Terracotta PetLib; do
            U="/tmp/upstream/$m/src/main/res"
            D="$SRC_ROOT/$m/src/main/res"
            if [ ! -d "$U" ] || [ ! -d "$SRC_ROOT/$m" ]; then continue; fi
            while IFS= read -r f; do
              if [ ! -e "$D/$f" ]; then
                mkdir -p "$(dirname "$D/$f")"
                cp "$U/$f" "$D/$f"
              fi
            done < <(cd "$U" && find . -type f | sed 's|^\./||')
          done
      - name: "Verificação 3/4 - estrutura do projeto"
        run: |
          base64 -d <<'B64' | gunzip | python3 -
          
          
          
          
          
          
          
          
          
          
          +RdzGZ//xRQAAA==
          B64
      - name: "Verificação 4/4 - correção automática"
        run: |
          set -uo pipefail
          cd "${PROJECT_DIR:?}" && : "${APP_DIR:?}"
          chmod +x gradlew
          cat > /tmp/gb.sh <<'S'
          cd "$PROJECT_DIR"
          e() { grep -E '^e: ' "$REPORT_DIR/build-$2.log" | sed -n '1,40p'; grep -A14 -m1 "What went wrong" "$REPORT_DIR/build-$2.log" | head -16; }
          f() { echo "::group::ERROS ($1)"; e "$@"; tail -n 40 "$REPORT_DIR/build-$2.log"; echo "::endgroup::"; { e "$@"; tail -n 30 "$REPORT_DIR/build-$2.log"; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"; echo "::error title=Falha em $1::$(e "$@" | sed -n '1,6p' | sed ':a;N;$!ba;s/\n/%0A/g')"; }
          for i in 1 2 3 4 5; do
            if ./gradlew "${APP_PATH}:$1" -I /tmp/oi.gradle --no-daemon -q --console=plain > "$REPORT_DIR/build-$2.log" 2>&1; then echo "Build $1 OK"; exit 0; fi
            c=0
            while read -r p l k n; do
              [ "$n" = weight ] && { sed -i -E "${l}s/\.weight\([^)]*\)//" "$p"; c=1; continue; }
              s=$(sed -n "${l}p" "$p"); r=$(echo "${s:0:$((k-1))}" | grep -oE '(drawable|mipmap|string)\.$' | cut -d. -f1)
              if [ "$r" = string ]; then
                X="$APP_DIR/src/main/res/values/zz_missing.xml"
                [ -f "$X" ] || printf '<resources>\n</resources>\n' > "$X"
                grep -q "\"$n\"" "$X" || { sed -i "s#</resources>#<string name=\"$n\">${n//_/ }</string>\n</resources>#" "$X"; c=1; echo "String criada: $n"; }
                continue
              fi
              [ -n "$r" ] || continue
              mkdir -p "$APP_DIR/src/main/res/$r"
              echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48"><path android:fillColor="#888" android:pathData="M24,24m-20,0a20,20 0 1,1 40,0a20,20 0 1,1 -40,0"/></vector>' > "$APP_DIR/src/main/res/$r/$n.xml"
              c=1; echo "Placeholder criado: $r/$n"
            done < <(sed -nE "s#^e: file://([^:]+):([0-9]+):([0-9]+) Unresolved reference '([A-Za-z0-9_]+)'.*#\1 \2 \3 \4#p" "$REPORT_DIR/build-$2.log" | sort -u)
            [ "$c" = 1 ] || { f "$@"; exit 1; }
          done
          f "$@"; exit 1
          S
          cat > /tmp/oi.gradle <<'O'
          allprojects { tasks.matching { it.class.name.contains('KotlinCompile') }.configureEach { t ->
            try {
              t.compilerOptions.optIn.addAll([
                'androidx.compose.material3.ExperimentalMaterial3Api',
                'androidx.compose.material3.ExperimentalMaterial3ExpressiveApi',
                'androidx.compose.foundation.ExperimentalFoundationApi',
                'androidx.compose.foundation.layout.ExperimentalLayoutApi',
                'androidx.compose.animation.ExperimentalAnimationApi',
                'androidx.compose.ui.ExperimentalComposeUiApi',
                'androidx.compose.animation.ExperimentalSharedTransitionApi'
              ])
            } catch (e) {}
          } }
          O
      - name: Adicionar Java 21 e 25 ao projeto
        run: |
          set -eu
          A=$(find "$SRC_ROOT" -type d -path "*/src/main/assets/runtimes" | sort | head -1)
          [ -n "$A" ] || { echo "::error::assets/runtimes nao encontrada"; exit 1; }
          mkdir -p "$A/jre-21" "$A/jre-25"
          W="$GITHUB_WORKSPACE"
          [ -f "$W/jre-21-universal.tar.xz" ] || { echo "::error::jre-21-universal.tar.xz ausente na raiz"; exit 1; }
          cp "$W/jre-21-universal.tar.xz" "$A/jre-21/universal.tar.xz"
          if [ -f "$W/jre-25-universal.tar.xz" ]; then
            cp "$W/jre-25-universal.tar.xz" "$A/jre-25/universal.tar.xz"
          else
            ls "$W"/jre-25-universal.tar.xz.part* >/dev/null || { echo "::error::jre-25 (ou .part00/.part01) ausente na raiz"; exit 1; }
            cat "$W"/jre-25-universal.tar.xz.part* > "$A/jre-25/universal.tar.xz"
          fi
          xz -t "$A/jre-21/universal.tar.xz" "$A/jre-25/universal.tar.xz"
          ls -l "$A/jre-21" "$A/jre-25"
      - name: Instalar JDKs necessários
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_LIST }}
      - name: Instalar Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          B="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ ! -x "$B/sdkmanager" ]; then
            curl -fsSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/ct.zip -d /tmp/ct && mkdir -p "$ANDROID_HOME/cmdline-tools" && mv /tmp/ct/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "$B" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$B/sdkmanager" --licenses >/dev/null 2>&1 || true
      - name: Instalar NDK
        if: env.NDK_VERSION != ''
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${NDK_VERSION}" 2>&1 | tee "$REPORT_DIR/ndk.log"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Instalar Rust (se o projeto usar)
        if: env.HAS_RUST == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked 2>&1 | tail -n 5
      - name: Gerar Cargo.lock ausente
        if: env.HAS_RUST == 'true'
        run: |
          find "$SRC_ROOT" -name Cargo.toml -not -path '*/target/*' | while read -r t; do
            [ -f "$(dirname "$t")/Cargo.lock" ] || { echo "Gerando Cargo.lock em $t"; cargo generate-lockfile --manifest-path "$t"; }
          done
      - name: Corrigir jni_bridge.rs
        if: env.HAS_RUST == 'true'
        run: |
          F="$SRC_ROOT/CatCore/rust/src/jni_bridge.rs"
          if [ ! -f "$F" ]; then
            F=$(find "$SRC_ROOT" -name jni_bridge.rs -not -path '*/target/*' | head -1 || true)
          fi
          [ -n "${F:-}" ] && [ -f "$F" ] || { echo "::warning::jni_bridge.rs não encontrado; patch ignorado."; exit 0; }
          sed -i -E "s/-> impl FnMut\(&str\) -> bool \+ 'a \{/-> impl FnMut(\&str) -> bool + use<'a, 'l, 'o> {/" "$F"
          sed -i 's/^use crate::{batch, hash, launch, manifest, plan,/use crate::{batch, hash, launch, manifest, perf, verify, plan,/' "$F"
          grep -q "use<'a, 'l, 'o>" "$F" || echo "::warning::patch progress() não aplicado (código já ajustado ou diferente)."
      - name: Reparar comentarios Kotlin (startup)
        run: |
          python3 - <<'PY'
          import os
          def fix(t):
              o=[];i=0;n=len(t);d=0;c=0
              while i<n:
                  x=t[i:i+2]
                  if d:
                      if x=="*/": d=0;o.append(x);i+=2
                      elif x=="/*": o.append("/(*)");c+=1;i+=2
                      else: o.append(t[i]);i+=1
                  elif t.startswith('"""',i):
                      j=t.find('"""',i+3);j=n if j<0 else j+3;o.append(t[i:j]);i=j
                  elif t[i] in "\"'":
                      q=t[i];j=i+1
                      while j<n and t[j]!=q and t[j]!="\n": j+=2 if t[j]=="\\" else 1
                      o.append(t[i:j+1]);i=j+1
                  elif x=="//":
                      j=t.find("\n",i);j=n if j<0 else j;o.append(t[i:j]);i=j
                  elif x=="/*": d=1;o.append(x);i+=2
                  else: o.append(t[i]);i+=1
              if d: o.append("\n*/\n");c+=1
              return "".join(o),c
          for dp,_,fs in os.walk(os.environ["SRC_ROOT"]):
              if "/build/" in dp+"/" or "/startup" not in dp: continue
              for f in fs:
                  if f.endswith(".kt"):
                      p=os.path.join(dp,f);r,c=fix(open(p,encoding="utf-8",errors="replace").read())
                      if c: open(p,"w",encoding="utf-8").write(r);print("Reparado:",p,c)
          PY
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decidir tipos de build
        run: |
          s=false; [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ] && s=true
          d=true; r=false
          case "$BUILD_TYPE" in
            debug) ;;
            release) d=false; r=true ;;
            both) r=true ;;
            *) r=$s ;;
          esac
          if [ "$r" = true ] && [ "$s" != true ]; then
            r=false
          fi
          echo "BUILD_DEBUG=$d" >> "$GITHUB_ENV"; echo "BUILD_RELEASE=$r" >> "$GITHUB_ENV"
      - name: Trocar nome e ícone do app (Cat Launcher)
        run: |
          cd "$PROJECT_DIR"; P="$APP_DIR/gradle.properties"; touch "$P"
          sed -i -E '/^launcher_(app_)?name=/d' "$P"
          printf '\nlauncher_app_name=Cat Launcher\nlauncher_name=Cat Launcher\n' >> "$P"
          python3 - <<'P'
          import zlib,struct,os,glob
          R=os.path.join(os.environ["PROJECT_DIR"],os.environ["APP_DIR"],"src/main/res")+"/"
          C=dict(O="E8923A",D="B0621C",W="F5EBDD",G="5CC84A",B="1B1B1B",P="E58A9A")
          H="........ ........ ..DD.... ..DOD... ..DOOOOD ..DOODOO ..DOOOOO ..DOBGGO ..DOOBBO ..DOOOOP ..DOWWOP ..DOWWWB ..DDOWWW ...DDOOO ....DDDD ........".split()
          G=[[bytes.fromhex(C.get(c,"2B1B4D")) for c in h+h[::-1]] for h in H]
          def png(s):
           w=lambda t,d:struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d))
           r=b"".join(b"\0"+b"".join(G[y*16//s][x*16//s] for x in range(s)) for y in range(s))
           return b"\x89PNG\r\n\x1a\n"+w(b"IHDR",struct.pack(">IIBBBBB",s,s,8,2,0,0,0))+w(b"IDAT",zlib.compress(r))+w(b"IEND",b"")
          P=os.environ["PROJECT_DIR"]+"/**/src/*/res/"
          for f in glob.glob(P+"mipmap-*/ic_lau
